<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Awesome World Models</title>
  <desc id="desc">A research atlas of predictive worlds. A teal wireframe globe branches into possible future states on a deep navy background.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101e30"/>
      <stop offset="1" stop-color="#07131f"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#1d6e70" stop-opacity=".36"/>
      <stop offset="1" stop-color="#0b1a29" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trajectory" x2="1" y2="0">
      <stop stop-color="#71eed2"/>
      <stop offset="1" stop-color="#e8c981"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a8d9d4" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="globe">
      <circle cx="1005" cy="183" r="142"/>
    </clipPath>
  </defs>
  <rect width="1280" height="420" rx="20" fill="url(#background)"/>
  <rect x="704" y="1" width="575" height="418" rx="20" fill="url(#grid)"/>
  <ellipse cx="1000" cy="194" rx="310" ry="270" fill="url(#halo)"/>
  <rect x="1" y="1" width="1278" height="418" rx="19" fill="none" stroke="#29404e"/>
