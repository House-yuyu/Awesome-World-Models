  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="76" letter-spacing="-2.5">
    <text x="59" y="167" fill="#f1f7fb">Awesome</text>
    <text x="59" y="246" fill="#71eed2">World Models</text>
  </g>
  <text x="64" y="292" fill="#b9cad5" font-family="Arial, Helvetica, sans-serif" font-size="22">Learn dynamics. Imagine what comes next.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="1.8">
